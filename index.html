<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Argon Jarvis — Telefon na Żywo v7</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    background: radial-gradient(circle at 50% 22%, #162238 0%, #090d16 78%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px 18px 28px;
    overflow: hidden;
  }
  .header { text-align: center; width: 100%; max-width: 410px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    background: rgba(16,185,129,0.18);
    color: #34d399;
    border: 1px solid rgba(16,185,129,0.45);
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 6px;
  }
  .name { font-size: 25px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 3px; }
  .state { font-size: 15px; color: #7dd3fc; font-weight: 600; min-height: 22px; }
  .timer { font-size: 12px; color: #64748b; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .top-bars {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
  }
  .voice-bar, .mode-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .v-pill, .m-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    color: #cbd5e1;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .v-pill.active {
    background: rgba(34,197,94,0.22);
    border-color: #4ade80;
    color: #4ade80;
  }
  .m-pill.active {
    background: rgba(56,189,248,0.22);
    border-color: #38bdf8;
    color: #38bdf8;
  }

  .orb-wrap {
    position: relative;
    width: 176px;
    height: 176px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .orb-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.42) 0%, rgba(56,189,248,0) 70%);
    transform: scale(1);
    transition: transform 0.06s ease-out;
  }
  .orb-core {
    position: relative;
    width: 118px;
    height: 118px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0284c7, #2563eb);
    box-shadow: 0 0 42px rgba(37,99,235,0.65), inset 0 2px 12px rgba(255,255,255,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
  }
  .orb-sub {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-top: 3px;
    color: rgba(255,255,255,0.9);
  }
  .orb-wrap:active .orb-core { transform: scale(0.92); }
  body.speaking .orb-core {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 0 55px rgba(16,185,129,0.75), inset 0 2px 12px rgba(255,255,255,0.4);
  }
  body.thinking .orb-core {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    box-shadow: 0 0 45px rgba(245,158,11,0.65);
    animation: pulseThink 0.6s infinite alternate;
  }
  @keyframes pulseThink {
    from { transform: scale(0.94); }
    to { transform: scale(1.06); }
  }

  .middle-stack {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  .send-now-btn {
    width: 100%;
    padding: 15px 18px;
    border-radius: 16px;
    border: 1px solid rgba(74,222,128,0.55);
    background: linear-gradient(135deg, #16a34a, #059669);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(22,163,74,0.45);
    transition: transform 0.1s, opacity 0.15s, background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .send-now-btn:active { transform: scale(0.96); }
  .send-now-btn.interrupt {
    background: linear-gradient(135deg, #0284c7, #2563eb);
    border-color: rgba(56,189,248,0.55);
    box-shadow: 0 8px 25px rgba(2,132,199,0.4);
  }
  .send-now-btn.disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  .transcript-box {
    width: 100%;
    min-height: 92px;
    max-height: 145px;
    overflow-y: auto;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 12px 15px;
    font-size: 14.5px;
    line-height: 1.42;
    color: #f1f5f9;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    backdrop-filter: blur(10px);
  }
  .sub-hint { font-size: 11.5px; color: #94a3b8; }

  .controls {
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .btn {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform 0.12s;
  }
  .btn:active { transform: scale(0.92); }
  .btn-start { background: #22c55e; width: 76px; height: 76px; font-size: 32px; }
  .btn-end { background: #ef4444; }
  .btn-mute { background: rgba(255,255,255,0.14); font-size: 22px; }
  .btn-mute.muted { background: #f59e0b; }
</style>
</head>
<body>

<div class="header">
  <div class="badge">⚡ v7 • Zero Zakłóceń Tła • Bezpośredni Mózg 0.7s</div>
  <div class="name">Argon Jarvis</div>
  <div class="state" id="stateText">Łączę...</div>
  <div class="timer" id="timerText">00:00</div>
  <div class="top-bars">
    <div class="mode-bar" id="modeBar">
      <button class="m-pill active" data-mode="manual">👆 Wyślij kliknięciem (Zero błędów tła)</button>
      <button class="m-pill" data-mode="auto">🎙️ Auto po ciszy</button>
    </div>
    <div class="voice-bar" id="voiceBar">
      <button class="v-pill active" data-vid="D8ErlhVOf4GjkEycIO7I">🔥 Casper</button>
      <button class="v-pill" data-vid="JAKjD1jCmqCqZB08hxlK">😎 Wiktor</button>
      <button class="v-pill" data-vid="lc6Dl3NzLdwoeMtGGKjy">🤙 Adrian</button>
      <button class="v-pill" data-vid="C1DBnkwmDIzoLOPlBvSg">🥃 Ignacius</button>
    </div>
  </div>
</div>

<div class="orb-wrap" id="orbWrap">
  <div class="orb-ring" id="orbRing"></div>
  <div class="orb-core" id="orbCore">
    <span id="orbIcon">🎙️</span>
    <span class="orb-sub" id="orbSub">WYŚLIJ</span>
  </div>
</div>

<div class="middle-stack">
  <button class="send-now-btn" id="sendNowBtn">✅ Skończyłem mówić — Wyślij teraz (lub Spacja)</button>
  <div class="transcript-box">
    <div id="liveText">Połączono. Mów śmiało, a gdy skończysz zdanie — kliknij zielony przycisk powyżej lub kulę.</div>
    <div class="sub-hint" id="hintText">Hałas z otoczenia i wentylatorów nigdy nie przerwie Ci wypowiedzi.</div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-mute" id="muteBtn" style="display:none" title="Wycisz mikrofon">🎤</button>
  <button class="btn btn-start" id="callBtn">📞</button>
</div>

<script>
(function() {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  function safeGetStorage(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function safeSetStorage(k, v) {
    try { localStorage.setItem(k, v); } catch (e) {}
  }

  const hash = new URLSearchParams(location.hash.slice(1));
  const EL_KEY = hash.get("k") || "";
  let VOICE_ID = safeGetStorage("jarvis_vid") || hash.get("v") || "D8ErlhVOf4GjkEycIO7I";
  let SEND_MODE = safeGetStorage("jarvis_send_mode") || "manual"; // Domyślnie manual: zero fałszywych wykryć hałasu!
  const IN_TOPIC = hash.get("in") || "";
  const OUT_TOPIC = hash.get("out") || "";

  document.querySelectorAll(".v-pill").forEach(btn => {
    if (btn.dataset.vid === VOICE_ID) btn.classList.add("active");
    else btn.classList.remove("active");
    btn.addEventListener("click", () => {
      VOICE_ID = btn.dataset.vid;
      safeSetStorage("jarvis_vid", VOICE_ID);
      document.querySelectorAll(".v-pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    });
  });

  document.querySelectorAll(".m-pill").forEach(btn => {
    if (btn.dataset.mode === SEND_MODE) btn.classList.add("active");
    else btn.classList.remove("active");
    btn.addEventListener("click", () => {
      SEND_MODE = btn.dataset.mode;
      safeSetStorage("jarvis_send_mode", SEND_MODE);
      document.querySelectorAll(".m-pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      updateActionUI();
    });
  });

  const stateEl = document.getElementById("stateText");
  const timerEl = document.getElementById("timerText");
  const liveEl = document.getElementById("liveText");
  const hintEl = document.getElementById("hintText");
  const orbRing = document.getElementById("orbRing");
  const orbIcon = document.getElementById("orbIcon");
  const orbSub = document.getElementById("orbSub");
  const orbWrap = document.getElementById("orbWrap");
  const sendNowBtn = document.getElementById("sendNowBtn");
  const callBtn = document.getElementById("callBtn");
  const muteBtn = document.getElementById("muteBtn");

  let inCall = false;
  let isMuted = false;
  let mode = "idle"; // idle | listening | thinking | speaking
  let audioCtx = null;
  let mediaStream = null;
  let mediaRecorder = null;
  let allChunks = [];
  let speechStartChunkIdx = 0;
  let speakingDetected = false;
  let voiceFrames = 0;
  let silenceStart = 0;
  let speechStart = 0;
  let noiseFloor = 22;
  let peakVoice = 38;
  let sse = null;
  let currentAudio = null;
  let callStartTime = 0;
  let timerInterval = null;
  let vadInterval = null;
  let thinkingTimer = null;
  let lastSpokenMsg = "";
  let lastSpokenAt = 0;

  function playReadyBeep() {
    try {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(520, audioCtx.currentTime);
      osc.frequency.setValueAtTime(680, audioCtx.currentTime + 0.06);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  function polishNumToWords(n) {
    n = Math.round(n);
    if (n === 0) return "zero";
    const jed = ["", "jeden", "dwa", "trzy", "cztery", "pięć", "sześć", "siedem", "osiem", "dziewięć"];
    const nascie = ["dziesięć", "jedenaście", "dwanaście", "trzynaście", "czternaście", "piętnaście", "szesnaście", "siedemnaście", "osiemnaście", "dziewiętnaście"];
    const dzies = ["", "dziesięć", "dwadzieścia", "trzydzieści", "czterdzieści", "pięćdziesiąt", "sześćdziesiąt", "siedemdziesiąt", "osiemdziesiąt", "dziewięćdziesiąt"];
    const setki = ["", "sto", "dwieście", "trzysta", "czterysta", "pięćset", "sześćset", "siedemset", "osiemset", "dziewięćset"];

    function under1000(x) {
      let out = [];
      if (x >= 100) { out.push(setki[Math.floor(x / 100)]); x %= 100; }
      if (x >= 10 && x <= 19) { out.push(nascie[x - 10]); }
      else {
        if (x >= 20) { out.push(dzies[Math.floor(x / 10)]); x %= 10; }
        if (x > 0) out.push(jed[x]);
      }
      return out.join(" ");
    }

    let parts = [];
    if (n >= 1000) {
      const th = Math.floor(n / 1000);
      n %= 1000;
      if (th === 1) parts.push("tysiąc");
      else if (th % 10 >= 2 && th % 10 <= 4 && (th % 100 < 10 || th % 100 >= 20)) parts.push(under1000(th) + " tysiące");
      else parts.push(under1000(th) + " tysięcy");
    }
    if (n > 0) parts.push(under1000(n));
    return parts.join(" ");
  }

  const daysGen = {
    1: "pierwszego", 2: "drugiego", 3: "trzeciego", 4: "czwartego", 5: "piątego",
    6: "szóstego", 7: "siódmego", 8: "ósmego", 9: "dziewiątego", 10: "dziesiątego",
    11: "jedenastego", 12: "dwunastego", 13: "trzynastego", 14: "czternastego", 15: "piętnastego",
    16: "szesnastego", 17: "siedemnastego", 18: "osiemnastego", 19: "dziewiętnastego", 20: "dwudziestego",
    21: "dwudziestego pierwszego", 22: "dwudziestego drugiego", 23: "dwudziestego trzeciego",
    24: "dwudziestego czwartego", 25: "dwudziestego piątego", 26: "dwudziestego szóstego",
    27: "dwudziestego siódmego", 28: "dwudziestego ósmego", 29: "dwudziestego dziewiątego",
    30: "trzydziestego", 31: "trzydziestego pierwszego"
  };
  const monthsGen = {
    1: "stycznia", 2: "lutego", 3: "marca", 4: "kwietnia", 5: "maja", 6: "czerwca",
    7: "lipca", 8: "sierpnia", 9: "września", 10: "października", 11: "listopada", 12: "grudnia"
  };

  function cleanTextForPolishTTS(text) {
    let s = text.replace(/[•🟢⚡✅🔊🤖🗣️📞📈🔥📋\*`_#]/g, "");
    s = s.replace(/\b(0?[1-9]|[12]\d|3[01])[./](0?[1-9]|1[0-2])(?:\.202\d)?\b/g, (m, d, mo) => {
      const di = parseInt(d, 10), mi = parseInt(mo, 10);
      if (daysGen[di] && monthsGen[mi]) return daysGen[di] + " " + monthsGen[mi];
      return m;
    });
    s = s.replace(/(\d)\s+(\d{3})\b/g, "$1$2");
    s = s.replace(/\bffmpegi\b/gi, "procesy wideo")
      .replace(/\bffmpeg\b/gi, "proces wideo")
      .replace(/\bprofit\s*sheet\b/gi, "profit szit")
      .replace(/\badloc\b/gi, "ad-lok")
      .replace(/\bstudiodermal\b/gi, "studio dermal")
      .replace(/\bischgl\b/gi, "iszgl")
      .replace(/\bval\s*thorens\b/gi, "wal torans")
      .replace(/\bUK\b/g, "ju-kej")
      .replace(/\bMSL\b/g, "em-es-el")
      .replace(/%/g, " procent")
      .replace(/PLN|zł/gi, " złotych");
    s = s.replace(/(\d+)[,.](\d+)/g, (_, a, b) => polishNumToWords(parseInt(a, 10)) + " przecinek " + polishNumToWords(parseInt(b, 10)));
    s = s.replace(/\b\d+\b/g, (m) => polishNumToWords(parseInt(m, 10)));
    return s.trim();
  }

  function updateActionUI() {
    if (!inCall) {
      sendNowBtn.className = "send-now-btn disabled";
      sendNowBtn.textContent = "📞 Kliknij zieloną słuchawkę poniżej";
      return;
    }
    if (mode === "listening") {
      sendNowBtn.className = "send-now-btn";
      sendNowBtn.textContent = "✅ Skończyłem mówić — Wyślij teraz (lub Spacja)";
      orbIcon.textContent = "🎙️";
      orbSub.textContent = "WYŚLIJ";
      hintEl.textContent = SEND_MODE === "manual"
        ? "Tryb bez zakłóceń: mów dowolnie długo i kliknij zielony przycisk (lub Spację), by wysłać."
        : "Tryb auto: wyśle po ciszy lub od razu po kliknięciu zielonego przycisku.";
    } else if (mode === "thinking") {
      sendNowBtn.className = "send-now-btn disabled";
      sendNowBtn.textContent = "⚡ Jarvis przygotowuje odpowiedź...";
      orbIcon.textContent = "⚡";
      orbSub.textContent = "MYŚLĘ";
    } else if (mode === "speaking") {
      sendNowBtn.className = "send-now-btn interrupt";
      sendNowBtn.textContent = "✋ Przerwij Jarvisowi i mów teraz";
      orbIcon.textContent = "🔊";
      orbSub.textContent = "PRZERWIJ";
    }
  }

  function setMode(m, label) {
    mode = m;
    document.body.className = m;
    stateEl.textContent = label;
    if (thinkingTimer) {
      clearTimeout(thinkingTimer);
      thinkingTimer = null;
    }
    if (m === "thinking") {
      thinkingTimer = setTimeout(() => {
        if (inCall && mode === "thinking") startListeningTurn();
      }, 9000);
    }
    updateActionUI();
  }

  function updateTimer() {
    if (!inCall) return;
    const sec = Math.floor((Date.now() - callStartTime) / 1000);
    const mm = String(Math.floor(sec / 60)).padStart(2, "0");
    const ss = String(sec % 60).padStart(2, "0");
    timerEl.textContent = mm + ":" + ss;
  }

  let speechQueue = [];

  async function speakText(text) {
    if (!inCall || !text) return;
    const now = Date.now();
    if (text === lastSpokenMsg && now - lastSpokenAt < 4000) return;
    lastSpokenMsg = text;
    lastSpokenAt = now;

    if (mode === "speaking" && currentAudio && !currentAudio.paused) {
      speechQueue.push(text);
      return;
    }
    if (mediaRecorder && mediaRecorder.state === "recording") {
      try { mediaRecorder.onstop = null; mediaRecorder.stop(); } catch (e) {}
    }
    setMode("speaking", "Jarvis mówi...");
    liveEl.textContent = "🤖 " + text;

    try {
      const ttsInput = cleanTextForPolishTTS(text);
      const url = "https://api.elevenlabs.io/v1/text-to-speech/" + VOICE_ID + "/stream?output_format=mp3_44100_128&optimize_streaming_latency=4";
      const resp = await fetch(url, {
        method: "POST",
        headers: {
          "xi-api-key": EL_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text: ttsInput,
          model_id: "eleven_flash_v2_5",
          language_code: "pl",
          voice_settings: { stability: 0.55, similarity_boost: 0.78, style: 0.0, use_speaker_boost: true, speed: 1.00 }
        })
      });
      if (!inCall || mode !== "speaking") return;
      const blob = await resp.blob();
      const audioUrl = URL.createObjectURL(blob);
      if (currentAudio) {
        currentAudio.pause();
      }
      currentAudio = new Audio(audioUrl);
      currentAudio.onended = () => {
        URL.revokeObjectURL(audioUrl);
        if (speechQueue.length > 0) {
          const nextMsg = speechQueue.shift();
          currentAudio = null;
          speakText(nextMsg);
          return;
        }
        setTimeout(() => {
          if (inCall && mode === "speaking") startListeningTurn();
        }, 180);
      };
      currentAudio.onerror = () => {
        if (inCall) startListeningTurn();
      };
      await currentAudio.play();
    } catch (e) {
      if (inCall) startListeningTurn();
    }
  }

  function connectSSE() {
    if (sse) sse.close();
    sse = new EventSource("https://ntfy.sh/" + OUT_TOPIC + "/sse");
    sse.onmessage = (ev) => {
      if (!inCall) return;
      try {
        const data = JSON.parse(ev.data);
        if (data.event === "message" && data.message) {
          speakText(data.message);
        }
      } catch (e) {}
    };
  }

  // Czarna lista halucynacji Scribe przy szumie otoczenia
  const NOISE_HALLUCINATIONS = new Set([
    "dziękuję", "dziekuje", "dzięki", "napisy", "muzyka", "cisza", "szum", "he", "hm", "hmm", "yyy", "eee", "aaa", "o", "a", "i", "w", "z"
  ]);

  async function processRecordedBlob(blob, mime) {
    if (!inCall || blob.size < 900) {
      if (inCall) startListeningTurn();
      return;
    }
    setMode("thinking", "Rozpoznaję mowę...");
    try {
      let ext = "webm";
      if (mime.includes("mp4") || mime.includes("aac") || mime.includes("m4a")) ext = "mp4";
      else if (mime.includes("ogg")) ext = "ogg";
      else if (mime.includes("wav")) ext = "wav";

      const fd = new FormData();
      fd.append("model_id", "scribe_v1");
      fd.append("language_code", "pl");
      fd.append("tag_audio_events", "false");
      fd.append("file", blob, "voice." + ext);

      const ctrl = new AbortController();
      const tId = setTimeout(() => ctrl.abort(), 5000);
      const r = await fetch("https://api.elevenlabs.io/v1/speech-to-text", {
        method: "POST",
        headers: { "xi-api-key": EL_KEY },
        body: fd,
        signal: ctrl.signal
      });
      clearTimeout(tId);
      const j = await r.json();
      let txt = (j.text || "").replace(/\([^)]*\)/g, "").replace(/\[[^\]]*\]/g, "").trim();
      const cleanLow = txt.toLowerCase().replace(/[.!,?…]/g, "").trim();
      const lettersOnly = txt.replace(/[^a-ząćęłńóśźżA-ZĄĆĘŁŃÓŚŹŻ]/g, "");
      if (!txt || lettersOnly.length < 3 || NOISE_HALLUCINATIONS.has(cleanLow)) {
        liveEl.textContent = "🎙️ Nie wykryto wyraźnego zdania — mów śmiało i kliknij Wyślij.";
        if (inCall) startListeningTurn();
        return;
      }

      liveEl.textContent = "🗣️ Ty: „" + txt + "”";
      setMode("thinking", "Jarvis odpowiada...");
      await fetch("https://ntfy.sh/" + IN_TOPIC, {
        method: "POST",
        body: txt
      });
    } catch (e) {
      if (inCall) startListeningTurn();
    }
  }

  function getSupportedMimeType() {
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
    for (const t of types) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) {
        return t;
      }
    }
    return "";
  }

  function startListeningTurn() {
    if (!inCall || !mediaStream) return;
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    setMode("listening", isMuted ? "Mikrofon wyciszony" : "🎙️ Mów śmiało — kliknij zielony przycisk gdy skończysz");
    allChunks = [];
    speechStartChunkIdx = 0;
    speakingDetected = false;
    voiceFrames = 0;
    silenceStart = 0;
    speechStart = 0;
    peakVoice = noiseFloor + 20;

    const mime = getSupportedMimeType();
    try {
      const opts = mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 };
      mediaRecorder = new MediaRecorder(mediaStream, opts);
    } catch (e) {
      mediaRecorder = new MediaRecorder(mediaStream);
    }
    const actualMime = mediaRecorder.mimeType || mime || "audio/mp4";
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) {
        allChunks.push(e.data);
      }
    };
    mediaRecorder.onstop = () => {
      if (!inCall || mode !== "listening") return;
      // NIGDY nie wycinaj środkowych chunków z kontenera WebM/MP4, bo to uszkadza strumień audio dla Scribe!
      const blob = new Blob(allChunks, { type: actualMime });
      processRecordedBlob(blob, actualMime);
    };
    mediaRecorder.start(200);
  }

  function triggerSendOrInterrupt() {
    if (!inCall) return;
    if (mode === "speaking") {
      speechQueue = [];
      if (currentAudio) currentAudio.pause();
      startListeningTurn();
    } else if (mode === "listening" && mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
    } else if (mode === "thinking") {
      startListeningTurn();
    }
  }

  orbWrap.addEventListener("click", triggerSendOrInterrupt);
  sendNowBtn.addEventListener("click", triggerSendOrInterrupt);

  // Obsługa Spacji / Entera na komputerze Mac
  window.addEventListener("keydown", (e) => {
    if (!inCall) return;
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      triggerSendOrInterrupt();
    }
  });

  async function startCall() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(mediaStream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const dataArr = new Uint8Array(analyser.frequencyBinCount);

      inCall = true;
      callStartTime = Date.now();
      callBtn.className = "btn btn-end";
      callBtn.textContent = "📵";
      muteBtn.style.display = "flex";
      timerInterval = setInterval(updateTimer, 1000);

      connectSSE();
      playReadyBeep();
      startListeningTurn();

      vadInterval = setInterval(() => {
        if (!inCall || isMuted || mode !== "listening") {
          orbRing.style.transform = "scale(1)";
          return;
        }
        analyser.getByteFrequencyData(dataArr);
        // Tylko pasmo ludzkiego głosu (ok. 350Hz - 2800Hz, odcięty niski szum wentylatorów Maca!)
        let vocalSum = 0;
        for (let i = 5; i <= 28; i++) vocalSum += dataArr[i];
        const vocalAvg = vocalSum / 24;

        const scale = Math.min(1.72, 1 + Math.max(0, vocalAvg - noiseFloor) / 55);
        orbRing.style.transform = "scale(" + scale.toFixed(2) + ")";

        const now = Date.now();

        if (!speakingDetected) {
          if (vocalAvg < noiseFloor + 15) {
            noiseFloor = noiseFloor * 0.93 + vocalAvg * 0.07;
          } else {
            noiseFloor = noiseFloor * 0.992 + vocalAvg * 0.008;
          }
          noiseFloor = Math.max(12, Math.min(68, noiseFloor));

          // Zapisz punkt startu mowy żeby uciąć wcześniejszą ciszę
          if (vocalAvg > noiseFloor + 18) {
            voiceFrames++;
            if (voiceFrames >= 5) {
              speakingDetected = true;
              speechStart = now - 200;
              silenceStart = now;
              peakVoice = vocalAvg;
              speechStartChunkIdx = Math.max(0, allChunks.length - 3);
            }
          } else {
            voiceFrames = Math.max(0, voiceFrames - 1);
          }
        } else {
          if (vocalAvg > peakVoice) {
            peakVoice = peakVoice * 0.6 + vocalAvg * 0.4;
          }
          // Tylko jeśli użytkownik ręcznie przełączył na tryb "Auto po ciszy"
          if (SEND_MODE === "auto") {
            const dynamicContinueThreshold = Math.max(
              noiseFloor + 14,
              noiseFloor + (peakVoice - noiseFloor) * 0.48
            );
            if (vocalAvg > dynamicContinueThreshold) {
              silenceStart = now;
            } else {
              const silenceDur = now - silenceStart;
              const spokenDur = silenceStart - speechStart;
              if (spokenDur >= 450 && silenceDur > 750) {
                speakingDetected = false;
                voiceFrames = 0;
                if (mediaRecorder && mediaRecorder.state === "recording") {
                  mediaRecorder.stop();
                }
              } else if (spokenDur < 450 && silenceDur > 600) {
                speakingDetected = false;
                voiceFrames = 0;
              }
            }
          }
        }
      }, 40);
    } catch (err) {
      stateEl.textContent = "Kliknij zieloną słuchawkę poniżej";
      liveEl.textContent = "Dotknij zielonej słuchawki, żeby włączyć mikrofon.";
    }
  }

  function endCall() {
    inCall = false;
    setMode("idle", "Rozłączono");
    if (timerInterval) clearInterval(timerInterval);
    if (vadInterval) clearInterval(vadInterval);
    if (sse) sse.close();
    if (currentAudio) currentAudio.pause();
    if (mediaRecorder && mediaRecorder.state === "recording") {
      try { mediaRecorder.onstop = null; mediaRecorder.stop(); } catch (e) {}
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
    }
    callBtn.className = "btn btn-start";
    callBtn.textContent = "📞";
    muteBtn.style.display = "none";
  }

  callBtn.addEventListener("click", () => {
    if (!inCall) startCall();
    else endCall();
  });

  muteBtn.addEventListener("click", () => {
    isMuted = !isMuted;
    muteBtn.classList.toggle("muted", isMuted);
    muteBtn.textContent = isMuted ? "🔇" : "🎤";
    if (mode === "listening") {
      stateEl.textContent = isMuted ? "Mikrofon wyciszony" : "🎙️ Mów śmiało — kliknij zielony przycisk gdy skończysz";
    }
  });

  setTimeout(() => {
    if (!inCall) startCall();
  }, 100);
})();
</script>
</body>
</html>
