<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Argon Jarvis — Ziomek Live v4</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    background: radial-gradient(circle at 50% 25%, #162238 0%, #090d16 75%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 28px 20px 36px;
    overflow: hidden;
  }
  .header { text-align: center; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    background: rgba(56,189,248,0.2);
    color: #38bdf8;
    border: 1px solid rgba(56,189,248,0.45);
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 8px;
  }
  .name { font-size: 27px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 5px; }
  .state { font-size: 16px; color: #7dd3fc; font-weight: 600; min-height: 24px; }
  .timer { font-size: 13px; color: #64748b; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .orb-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .orb-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.4) 0%, rgba(56,189,248,0) 70%);
    transform: scale(1);
    transition: transform 0.06s ease-out;
  }
  .orb-core {
    position: relative;
    width: 126px;
    height: 126px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0284c7, #2563eb);
    box-shadow: 0 0 45px rgba(37,99,235,0.65), inset 0 2px 12px rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
  }
  .orb-wrap:active .orb-core { transform: scale(0.93); }
  body.speaking .orb-core {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 0 55px rgba(16,185,129,0.75), inset 0 2px 12px rgba(255,255,255,0.4);
  }
  body.thinking .orb-core {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    box-shadow: 0 0 45px rgba(245,158,11,0.65);
    animation: pulseThink 0.6s infinite alternate;
  }
  @keyframes pulseThink {
    from { transform: scale(0.94); }
    to { transform: scale(1.06); }
  }

  .transcript-box {
    width: 100%;
    max-width: 390px;
    min-height: 104px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 14px 16px;
    font-size: 16px;
    line-height: 1.45;
    color: #f1f5f9;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    backdrop-filter: blur(10px);
  }
  .sub-hint { font-size: 12px; color: #94a3b8; }

  .controls {
    display: flex;
    gap: 28px;
    align-items: center;
  }
  .btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform 0.12s;
  }
  .btn:active { transform: scale(0.92); }
  .btn-start { background: #22c55e; width: 84px; height: 84px; font-size: 34px; }
  .btn-end { background: #ef4444; }
  .btn-mute { background: rgba(255,255,255,0.14); font-size: 24px; }
  .btn-mute.muted { background: #f59e0b; }
</style>
</head>
<body>

<div class="header">
  <div class="badge">🎙️ v4 • Czysty Głos 1.0x • Odporny na Szum Komputera</div>
  <div class="name">Argon Jarvis</div>
  <div class="state" id="stateText">Łączę...</div>
  <div class="timer" id="timerText">00:00</div>
</div>

<div class="orb-wrap" id="orbWrap">
  <div class="orb-ring" id="orbRing"></div>
  <div class="orb-core" id="orbCore">🎙️</div>
</div>

<div class="transcript-box">
  <div id="liveText">Gadaj normalnie — szum wentylatorów i echo głośnika są całkowicie odcięte.</div>
  <div class="sub-hint" id="hintText">Dotknij kuli w dowolnej chwili, aby od razu wysłać zdanie lub przerwać</div>
</div>

<div class="controls">
  <button class="btn btn-mute" id="muteBtn" style="display:none" title="Wycisz mikrofon">🎤</button>
  <button class="btn btn-start" id="callBtn">📞</button>
</div>

<script>
(function() {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const hash = new URLSearchParams(location.hash.slice(1));
  const EL_KEY = hash.get("k") || "";
  // Domyślnie spokojny, naturalny polski głos męski (vEEOzNgW5AZVHnBZA03D)
  const VOICE_ID = hash.get("v") || "vEEOzNgW5AZVHnBZA03D";
  const IN_TOPIC = hash.get("in") || "";
  const OUT_TOPIC = hash.get("out") || "";

  const stateEl = document.getElementById("stateText");
  const timerEl = document.getElementById("timerText");
  const liveEl = document.getElementById("liveText");
  const orbRing = document.getElementById("orbRing");
  const orbCore = document.getElementById("orbCore");
  const orbWrap = document.getElementById("orbWrap");
  const callBtn = document.getElementById("callBtn");
  const muteBtn = document.getElementById("muteBtn");

  let inCall = false;
  let isMuted = false;
  let mode = "idle"; // idle | listening | thinking | speaking
  let audioCtx = null;
  let mediaStream = null;
  let mediaRecorder = null;
  let allChunks = [];
  let speechStartChunkIdx = 0;
  let speakingDetected = false;
  let voiceFrames = 0;
  let silenceStart = 0;
  let speechStart = 0;
  let noiseFloor = 22;
  let peakVoice = 35;
  let sse = null;
  let currentAudio = null;
  let callStartTime = 0;
  let timerInterval = null;
  let vadInterval = null;
  let thinkingTimer = null;

  function polishNumToWords(n) {
    n = Math.round(n);
    if (n === 0) return "zero";
    const jed = ["", "jeden", "dwa", "trzy", "cztery", "pięć", "sześć", "siedem", "osiem", "dziewięć"];
    const nascie = ["dziesięć", "jedenaście", "dwanaście", "trzynaście", "czternaście", "piętnaście", "szesnaście", "siedemnaście", "osiemnaście", "dziewiętnaście"];
    const dzies = ["", "dziesięć", "dwadzieścia", "trzydzieści", "czterdzieści", "pięćdziesiąt", "sześćdziesiąt", "siedemdziesiąt", "osiemdziesiąt", "dziewięćdziesiąt"];
    const setki = ["", "sto", "dwieście", "trzysta", "czterysta", "pięćset", "sześćset", "siedemset", "osiemset", "dziewięćset"];

    function under1000(x) {
      let out = [];
      if (x >= 100) { out.push(setki[Math.floor(x / 100)]); x %= 100; }
      if (x >= 10 && x <= 19) { out.push(nascie[x - 10]); }
      else {
        if (x >= 20) { out.push(dzies[Math.floor(x / 10)]); x %= 10; }
        if (x > 0) out.push(jed[x]);
      }
      return out.join(" ");
    }

    let parts = [];
    if (n >= 1000) {
      const th = Math.floor(n / 1000);
      n %= 1000;
      if (th === 1) parts.push("tysiąc");
      else if (th % 10 >= 2 && th % 10 <= 4 && (th % 100 < 10 || th % 100 >= 20)) parts.push(under1000(th) + " tysiące");
      else parts.push(under1000(th) + " tysięcy");
    }
    if (n > 0) parts.push(under1000(n));
    return parts.join(" ");
  }

  function cleanTextForPolishTTS(text) {
    let s = text.replace(/[•🟢⚡✅🔊🤖🗣️📞]/g, "").replace(/%/g, " procent").replace(/PLN|zł/gi, " złotych");
    s = s.replace(/(\d+)[,.](\d+)/g, (_, a, b) => polishNumToWords(parseInt(a, 10)) + " i " + polishNumToWords(parseInt(b, 10)));
    s = s.replace(/\b\d+\b/g, (m) => polishNumToWords(parseInt(m, 10)));
    return s.trim();
  }

  function setMode(m, label) {
    mode = m;
    document.body.className = m;
    stateEl.textContent = label;
    if (thinkingTimer) {
      clearTimeout(thinkingTimer);
      thinkingTimer = null;
    }
    if (m === "listening") orbCore.textContent = "🎙️";
    else if (m === "thinking") {
      orbCore.textContent = "⚡";
      thinkingTimer = setTimeout(() => {
        if (inCall && mode === "thinking") startListeningTurn();
      }, 6500);
    } else if (m === "speaking") orbCore.textContent = "🔊";
  }

  function updateTimer() {
    if (!inCall) return;
    const sec = Math.floor((Date.now() - callStartTime) / 1000);
    const mm = String(Math.floor(sec / 60)).padStart(2, "0");
    const ss = String(sec % 60).padStart(2, "0");
    timerEl.textContent = mm + ":" + ss;
  }

  async function speakText(text) {
    if (!inCall) return;
    // Zatrzymaj nagrywanie mikrofonu na czas mówienia Jarvisa, żeby NIGDY nie łapał własnego echa z głośnika!
    if (mediaRecorder && mediaRecorder.state === "recording") {
      try { mediaRecorder.onstop = null; mediaRecorder.stop(); } catch (e) {}
    }
    setMode("speaking", "Jarvis mówi (dotknij kuli, by przerwać)");
    liveEl.textContent = "🤖 " + text;

    try {
      const ttsInput = cleanTextForPolishTTS(text);
      // Czysta jakość 44.1kHz, naturalna prędkość 1.0x (zero robotycznego przyspieszania!)
      const url = "https://api.elevenlabs.io/v1/text-to-speech/" + VOICE_ID + "?output_format=mp3_44100_64&optimize_streaming_latency=2";
      const resp = await fetch(url, {
        method: "POST",
        headers: {
          "xi-api-key": EL_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text: ttsInput,
          model_id: "eleven_turbo_v2_5",
          language_code: "pl",
          voice_settings: { stability: 0.55, similarity_boost: 0.80, style: 0.0, use_speaker_boost: true, speed: 1.0 }
        })
      });
      if (!inCall || mode !== "speaking") return;
      const blob = await resp.blob();
      const audioUrl = URL.createObjectURL(blob);
      if (currentAudio) {
        currentAudio.pause();
      }
      currentAudio = new Audio(audioUrl);
      currentAudio.onended = () => {
        URL.revokeObjectURL(audioUrl);
        // Odczekaj 220ms po zakończeniu głosu Jarvisa, żeby pogłos w pokoju ucichł zanim włączymy mikrofon
        setTimeout(() => {
          if (inCall && mode === "speaking") startListeningTurn();
        }, 220);
      };
      currentAudio.onerror = () => {
        if (inCall) startListeningTurn();
      };
      await currentAudio.play();
    } catch (e) {
      if (inCall) startListeningTurn();
    }
  }

  function connectSSE() {
    if (sse) sse.close();
    sse = new EventSource("https://ntfy.sh/" + OUT_TOPIC + "/sse");
    sse.onmessage = (ev) => {
      if (!inCall) return;
      try {
        const data = JSON.parse(ev.data);
        if (data.event === "message" && data.message) {
          speakText(data.message);
        }
      } catch (e) {}
    };
  }

  async function processRecordedBlob(blob, mime) {
    if (!inCall || blob.size < 1000) {
      if (inCall) startListeningTurn();
      return;
    }
    setMode("thinking", "Sekunda...");
    try {
      let ext = "webm";
      if (mime.includes("mp4") || mime.includes("aac") || mime.includes("m4a")) ext = "mp4";
      else if (mime.includes("ogg")) ext = "ogg";
      else if (mime.includes("wav")) ext = "wav";

      const fd = new FormData();
      fd.append("model_id", "scribe_v1");
      fd.append("language_code", "pl");
      fd.append("tag_audio_events", "false");
      fd.append("file", blob, "voice." + ext);

      const ctrl = new AbortController();
      const tId = setTimeout(() => ctrl.abort(), 3500);
      const r = await fetch("https://api.elevenlabs.io/v1/speech-to-text", {
        method: "POST",
        headers: { "xi-api-key": EL_KEY },
        body: fd,
        signal: ctrl.signal
      });
      clearTimeout(tId);
      const j = await r.json();
      let txt = (j.text || "").replace(/\([^)]*\)/g, "").replace(/\[[^\]]*\]/g, "").trim();
      const lettersOnly = txt.replace(/[^a-ząćęłńóśźżA-ZĄĆĘŁŃÓŚŹŻ]/g, "");
      if (!txt || lettersOnly.length < 2) {
        if (inCall) startListeningTurn();
        return;
      }

      liveEl.textContent = "🗣️ Ty: „" + txt + "”";
      setMode("thinking", "Już odpowiadam...");
      await fetch("https://ntfy.sh/" + IN_TOPIC, {
        method: "POST",
        body: txt
      });
    } catch (e) {
      if (inCall) startListeningTurn();
    }
  }

  function getSupportedMimeType() {
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
    for (const t of types) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) {
        return t;
      }
    }
    return "";
  }

  function startListeningTurn() {
    if (!inCall || !mediaStream) return;
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    setMode("listening", isMuted ? "Mikrofon wyciszony" : "Słucham Cię stary — mów...");
    allChunks = [];
    speechStartChunkIdx = 0;
    speakingDetected = false;
    voiceFrames = 0;
    silenceStart = 0;
    speechStart = 0;
    peakVoice = noiseFloor + 18;

    const mime = getSupportedMimeType();
    try {
      mediaRecorder = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
    } catch (e) {
      mediaRecorder = new MediaRecorder(mediaStream);
    }
    const actualMime = mediaRecorder.mimeType || mime || "audio/mp4";
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) {
        allChunks.push(e.data);
      }
    };
    mediaRecorder.onstop = () => {
      if (!inCall || mode !== "listening") return;
      let sendChunks = allChunks;
      if (speechStartChunkIdx > 2 && allChunks.length > speechStartChunkIdx) {
        sendChunks = [allChunks[0], ...allChunks.slice(Math.max(1, speechStartChunkIdx - 2))];
      }
      const blob = new Blob(sendChunks, { type: actualMime });
      processRecordedBlob(blob, actualMime);
    };
    mediaRecorder.start(120);
  }

  function interruptOrSendNow() {
    if (mode === "speaking") {
      if (currentAudio) currentAudio.pause();
      startListeningTurn();
    } else if (mode === "listening" && mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
    } else if (mode === "thinking") {
      startListeningTurn();
    }
  }

  orbWrap.addEventListener("click", () => {
    if (inCall) interruptOrSendNow();
  });

  async function startCall() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(mediaStream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const dataArr = new Uint8Array(analyser.frequencyBinCount);

      inCall = true;
      callStartTime = Date.now();
      callBtn.className = "btn btn-end";
      callBtn.textContent = "📵";
      muteBtn.style.display = "flex";
      timerInterval = setInterval(updateTimer, 1000);

      connectSSE();

      vadInterval = setInterval(() => {
        if (!inCall || isMuted || mode !== "listening") {
          orbRing.style.transform = "scale(1)";
          return;
        }
        analyser.getByteFrequencyData(dataArr);
        let vocalSum = 0;
        for (let i = 3; i <= 26; i++) vocalSum += dataArr[i];
        const vocalAvg = vocalSum / 24;

        const scale = Math.min(1.75, 1 + Math.max(0, vocalAvg - noiseFloor) / 60);
        orbRing.style.transform = "scale(" + scale.toFixed(2) + ")";

        const now = Date.now();

        if (!speakingDetected) {
          // Dopasowuj poziom tła BEZ sztucznego limitu (nawet gdy wentylatory Maca szumią na 45!)
          if (vocalAvg < noiseFloor + 14) {
            noiseFloor = noiseFloor * 0.92 + vocalAvg * 0.08;
          } else {
            noiseFloor = noiseFloor * 0.992 + vocalAvg * 0.008;
          }
          noiseFloor = Math.max(10, Math.min(65, noiseFloor));

          if (vocalAvg > noiseFloor + 16) {
            voiceFrames++;
            if (voiceFrames >= 4) {
              speakingDetected = true;
              speechStart = now - 180;
              silenceStart = now;
              peakVoice = vocalAvg;
              speechStartChunkIdx = Math.max(0, allChunks.length - 2);
              stateEl.textContent = "Słyszę Cię...";
            }
          } else {
            voiceFrames = Math.max(0, voiceFrames - 1);
          }
        } else {
          // Jesteśmy w trakcie słuchania Twojego zdania!
          if (vocalAvg > peakVoice) {
            peakVoice = peakVoice * 0.6 + vocalAvg * 0.4;
          }
          // Próg kontynuacji mowy zależy od głośności Twojego głosu względem wentylatorów!
          // Jeśli głośność spadnie do dolnych 42% między szumem tła a Twoim głosem -> to znaczy że skończyłeś mówić, a szumi tylko komputer!
          const dynamicContinueThreshold = Math.max(
            noiseFloor + 11,
            noiseFloor + (peakVoice - noiseFloor) * 0.42
          );

          if (vocalAvg > dynamicContinueThreshold) {
            silenceStart = now;
          } else {
            const silenceDur = now - silenceStart;
            const spokenDur = silenceStart - speechStart;
            if (spokenDur >= 280 && silenceDur > 580) {
              speakingDetected = false;
              voiceFrames = 0;
              if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
              }
            } else if (spokenDur < 280 && silenceDur > 600) {
              speakingDetected = false;
              voiceFrames = 0;
              stateEl.textContent = "Słucham Cię stary — mów...";
            }
          }
        }
      }, 45);

      speakText("Siema stary, włączyłem spokojny, czysty głos i odciąłem szum Twojego komputera. Jak mnie teraz słychać?");
    } catch (err) {
      stateEl.textContent = "Kliknij zieloną słuchawkę poniżej";
      liveEl.textContent = "Dotknij zielonej słuchawki, żeby włączyć mikrofon.";
    }
  }

  function endCall() {
    inCall = false;
    setMode("idle", "Rozłączono");
    if (timerInterval) clearInterval(timerInterval);
    if (vadInterval) clearInterval(vadInterval);
    if (sse) sse.close();
    if (currentAudio) currentAudio.pause();
    if (mediaRecorder && mediaRecorder.state === "recording") {
      try { mediaRecorder.onstop = null; mediaRecorder.stop(); } catch (e) {}
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
    }
    callBtn.className = "btn btn-start";
    callBtn.textContent = "📞";
    muteBtn.style.display = "none";
  }

  callBtn.addEventListener("click", () => {
    if (!inCall) startCall();
    else endCall();
  });

  muteBtn.addEventListener("click", () => {
    isMuted = !isMuted;
    muteBtn.classList.toggle("muted", isMuted);
    muteBtn.textContent = isMuted ? "🔇" : "🎤";
    if (mode === "listening") {
      stateEl.textContent = isMuted ? "Mikrofon wyciszony" : "Słucham Cię stary — mów...";
    }
  });

  setTimeout(() => {
    if (!inCall) startCall();
  }, 120);
})();
</script>
</body>
</html>
