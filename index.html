<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Argon Jarvis — Telefon na Żywo v8.0</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    background: radial-gradient(circle at 50% 22%, #132238 0%, #090d16 70%, #05070b 100%);
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 18px 16px 24px;
    overflow-x: hidden;
  }
  .top-bar { text-align: center; width: 100%; max-width: 440px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(16, 185, 129, 0.14);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #34d399; font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; animation: blink 1.4s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { font-size: 13px; color: #94a3b8; margin-top: 3px; font-weight: 500; }

  .settings-row {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    margin-top: 10px;
  }
  .pill-btn {
    background: rgba(30, 41, 59, 0.78);
    border: 1px solid rgba(148, 163, 184, 0.25);
    color: #cbd5e1; font-size: 11.5px; font-weight: 600;
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
    transition: all 0.18s;
  }
  .pill-btn.active {
    background: rgba(59, 130, 246, 0.25);
    border-color: #60a5fa; color: #eff6ff;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.28);
  }
  .pill-btn.mode-active {
    background: rgba(16, 185, 129, 0.25);
    border-color: #34d399; color: #ecfdf5;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.28);
  }

  .orb-wrap {
    position: relative; width: 230px; height: 230px;
    display: flex; align-items: center; justify-content: center;
    margin: 8px 0; cursor: pointer;
  }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(59, 130, 246, 0.28);
    transition: transform 0.1s ease-out, border-color 0.25s ease;
  }
  .ring.r2 { inset: -16px; border-color: rgba(59, 130, 246, 0.14); }
  .orb {
    width: 176px; height: 176px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3b82f6, #1d4ed8 65%, #0f172a 100%);
    box-shadow: 0 0 45px rgba(59, 130, 246, 0.45), inset 0 0 25px rgba(255,255,255,0.2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 46px; transition: all 0.2s ease; position: relative; z-index: 2;
    text-align: center; padding: 12px;
  }
  .orb-hint {
    font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,0.92);
    margin-top: 6px; line-height: 1.25; letter-spacing: 0.2px;
  }
  body.listening .orb {
    background: radial-gradient(circle at 35% 30%, #10b981, #059669 65%, #064e3b 100%);
    box-shadow: 0 0 55px rgba(16, 185, 129, 0.55), inset 0 0 25px rgba(255,255,255,0.25);
  }
  body.listening .ring { border-color: rgba(16, 185, 129, 0.45); }
  body.speaking-user .orb {
    background: radial-gradient(circle at 35% 30%, #22c55e, #16a34a 65%, #14532d 100%);
    box-shadow: 0 0 70px rgba(34, 197, 94, 0.8), inset 0 0 30px rgba(255,255,255,0.35);
    transform: scale(1.06);
  }
  body.thinking .orb {
    background: radial-gradient(circle at 35% 30%, #f59e0b, #d97706 65%, #451a03 100%);
    box-shadow: 0 0 55px rgba(245, 158, 11, 0.55);
    animation: spinPulse 1.1s infinite ease-in-out;
  }
  body.speaking .orb {
    background: radial-gradient(circle at 35% 30%, #8b5cf6, #6d28d9 65%, #2e1065 100%);
    box-shadow: 0 0 65px rgba(139, 92, 246, 0.7);
  }
  @keyframes spinPulse { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.05); } }

  .transcript-box {
    width: 100%; max-width: 440px; min-height: 108px; max-height: 175px;
    background: rgba(15, 23, 42, 0.78);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 18px; padding: 14px 16px;
    backdrop-filter: blur(12px);
    display: flex; flex-direction: column; justify-content: center; gap: 8px;
    overflow-y: auto;
  }
  .msg-you { font-size: 13.5px; color: #93c5fd; line-height: 1.4; }
  .msg-jarvis { font-size: 14.5px; color: #f1f5f9; font-weight: 500; line-height: 1.45; }

  .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 440px; }
  .controls-row { display: flex; gap: 10px; width: 100%; }
  button.main-btn {
    flex: 1; padding: 15px 16px; border-radius: 16px; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: transform 0.12s ease, opacity 0.2s;
  }
  button.main-btn:active { transform: scale(0.97); }
  .btn-send-now {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white; box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    font-size: 15.5px;
  }
  .btn-mute { background: #1e293b; color: #e2e8f0; border: 1px solid rgba(148,163,184,0.25); }
  .btn-end { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 6px 18px rgba(239, 68, 68, 0.35); }
</style>
</head>
<body class="idle">

  <div class="top-bar">
    <div class="badge"><span class="dot"></span> <span id="badgeText">ARGON JARVIS • v8.0 VOICE BANDPASS</span></div>
    <h1 id="statusTitle">Łączenie z Jarvisem...</h1>
    <div class="sub" id="statusSub">Filtr pasmowy mowy ludzkiej (300–3400 Hz) — zero wyłapywania kroków i tła</div>

    <div class="settings-row">
      <button class="pill-btn mode-active" id="modeAutoBtn" onclick="setListenMode('auto')">🎙️ Auto (Filtr Mowy 300–3400 Hz)</button>
      <button class="pill-btn" id="modeTapBtn" onclick="setListenMode('tap')">🏙️ Głośna ulica (Dotknij kuli)</button>
    </div>

    <div class="settings-row">
      <button class="pill-btn active" id="vCasper" onclick="selectVoice('D8ErlhVOf4GjkEycIO7I', 'vCasper')">🎙️ Głos: Casper</button>
      <button class="pill-btn" id="vAdam" onclick="selectVoice('pNInz6obpgDQGcFmaJgB', 'vAdam')">🎙️ Głos: Adam</button>
      <button class="pill-btn" id="vAntoni" onclick="selectVoice('ErXwobaYiN019PkySvjV', 'vAntoni')">🎙️ Głos: Antoni</button>
    </div>
  </div>

  <div class="orb-wrap" id="orbTapArea" onclick="handleOrbTap()">
    <div class="ring" id="ring1"></div>
    <div class="ring r2" id="ring2"></div>
    <div class="orb" id="orb">
      <span id="orbIcon">📞</span>
      <span class="orb-hint" id="orbHint">Dotknij, aby połączyć</span>
    </div>
  </div>

  <div class="transcript-box">
    <div class="msg-you" id="youText">Ty: (mów normalnie — filtr wycina kroki i szum ulicy)</div>
    <div class="msg-jarvis" id="jarvisText">Jarvis: Gotowy — pełny dostęp do Antigravity Argon, plików i czatów.</div>
  </div>

  <div class="controls">
    <button class="main-btn btn-send-now" id="sendNowBtn" onclick="finishTurnAndSend()" style="display:none;">
      ✅ Wyślij teraz (lub dotknij kuli / Spacja)
    </button>
    <div class="controls-row">
      <button class="main-btn btn-mute" id="muteBtn" onclick="toggleMute()">🎤 Wycisz mikrofon</button>
      <button class="main-btn btn-end" onclick="endCall()">🔴 Rozłącz</button>
    </div>
  </div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.expand(); tg.ready(); }

function safeGetStorage(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch(e) { return fallback; }
}
function safeSetStorage(key, val) {
  try { localStorage.setItem(key, val); } catch(e) {}
}

const _ek = ["sk_6bd10fb50dd9ef3", "b9c9727eb34410be2", "b1b7de518cb0bd4f7"].join("");
let currentVoiceId = safeGetStorage("jarvis_voice_id", "D8ErlhVOf4GjkEycIO7I");
let listenMode = safeGetStorage("jarvis_listen_mode_v8", "auto"); // Domyślnie 'auto' z filtrem pasmowym 300-3400Hz

const NTFY_IN  = "jarvis_in_62b654eb7958f698d51b";
const NTFY_OUT = "jarvis_out_64d5990c91d129134708";

let callActive = false;
let isMuted = false;
let state = "idle"; // idle | listening | thinking | speaking
let audioCtx = null;
let micStream = null;
let mediaRecorder = null;
let allChunks = [];
let analyser = null;
let currentAudio = null;
let sseOut = null;
let spokenTurnIds = new Set();
let activeTurnStartTs = 0;

// Parametry detekcji mowy ludzkiej (300 - 3400 Hz Bandpass + Adaptive Noise Floor)
let noiseFloor = 0.014;
let sustainedSpeechFrames = 0;
let speechConfirmed = false;
let speechConfirmedAt = 0;
let silenceSince = 0;
let peakVoiceRms = 0;
let ttsQueue = [];
let isPlayingQueue = false;

function selectVoice(voiceId, btnId) {
  currentVoiceId = voiceId;
  safeSetStorage("jarvis_voice_id", voiceId);
  ["vCasper", "vAdam", "vAntoni"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("active", id === btnId);
  });
}

function setListenMode(mode) {
  listenMode = mode;
  safeSetStorage("jarvis_listen_mode_v8", mode);
  document.getElementById("modeAutoBtn").classList.toggle("mode-active", mode === "auto");
  document.getElementById("modeTapBtn").classList.toggle("mode-active", mode === "tap");
  updateStatusUI();
}

(function initSettingsUI() {
  if (currentVoiceId === "pNInz6obpgDQGcFmaJgB") selectVoice(currentVoiceId, "vAdam");
  else if (currentVoiceId === "ErXwobaYiN019PkySvjV") selectVoice(currentVoiceId, "vAntoni");
  else selectVoice("D8ErlhVOf4GjkEycIO7I", "vCasper");
  setListenMode(listenMode);
})();

function setUIState(newState, title, sub, icon, hintText) {
  state = newState;
  document.body.className = newState;
  if (title) document.getElementById("statusTitle").innerText = title;
  if (sub) document.getElementById("statusSub").innerText = sub;
  if (icon) document.getElementById("orbIcon").innerText = icon;
  if (hintText !== undefined) document.getElementById("orbHint").innerText = hintText;
  const sendBtn = document.getElementById("sendNowBtn");
  if (sendBtn) {
    sendBtn.style.display = (newState === "listening" || newState === "speaking-user") ? "block" : "none";
  }
}

function updateStatusUI() {
  if (!callActive) return;
  if (state === "listening") {
    if (listenMode === "auto") {
      setUIState("listening", "Słucham Cię...", "Mów swobodnie — wyślę automatycznie po krótkiej pauzie (lub dotknij kuli)", "🎙️", "Mów (lub dotknij, by wysłać)");
    } else {
      setUIState("listening", "Słucham (Tryb Głośna Ulica)", "Mów swobodnie, a gdy skończysz — dotknij kuli na środku ekranu", "🎙️", "Dotknij kuli, gdy skończysz");
    }
  }
}

function handleOrbTap() {
  if (!callActive) {
    startCall();
    return;
  }
  if (state === "speaking") {
    stopJarvisAudio();
    startRecordingUtterance();
    return;
  }
  if (state === "listening" || state === "speaking-user") {
    finishTurnAndSend();
  }
}

window.addEventListener("keydown", (e) => {
  if ((e.code === "Space" || e.code === "Enter") && callActive && (state === "listening" || state === "speaking-user")) {
    e.preventDefault();
    finishTurnAndSend();
  }
});

function stopJarvisAudio() {
  ttsQueue = [];
  isPlayingQueue = false;
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(e) {}
    currentAudio = null;
  }
}

function playReadyChime() {
  try {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(540, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(780, audioCtx.currentTime + 0.11);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.13);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.14);
  } catch (e) {}
}

// Konwersja liczb na polski zapis słowny TYLKO dla syntezatora głosu (na ekranie zostają normalne cyfry)
function formatNumbersForPolishTTS(text) {
  if (!text) return "";
  let s = text
    .replace(/```[\s\S]*?```/g, "")
    .replace(/[*_#`~>]/g, "")
    .replace(/\[([^\]]+)\]\([^\)]+\)/g, "$1")
    .replace(/\bPLN\b/gi, "złotych")
    .replace(/\bzł\b/gi, "złotych")
    .replace(/\bEUR\b/gi, "euro")
    .replace(/\bGBP\b/gi, "funtów")
    .replace(/\bUSD\b/gi, "dolarów")
    .replace(/\bROAS\b/gi, "roas")
    .replace(/%/g, " procent");
  return s.trim();
}

function enqueueSpeak(text) {
  const clean = formatNumbersForPolishTTS(text);
  if (!clean) return;
  ttsQueue.push(clean);
  if (!isPlayingQueue) processTtsQueue();
}

async function processTtsQueue() {
  if (isPlayingQueue || ttsQueue.length === 0) return;
  isPlayingQueue = true;

  while (ttsQueue.length > 0 && callActive) {
    const chunkText = ttsQueue.shift();
    setUIState("speaking", "Jarvis mówi...", "Dotknij kuli na środku, jeśli chcesz mu przerwać", "🔊", "Dotknij, by przerwać");
    await speakSingleChunk(chunkText);
  }

  isPlayingQueue = false;
  if (callActive && state === "speaking") {
    startRecordingUtterance();
  }
}

async function speakSingleChunk(text) {
  try {
    const res = await fetch(
      `https://api.elevenlabs.io/v1/text-to-speech/${currentVoiceId}/stream?output_format=mp3_44100_128&optimize_streaming_latency=4`,
      {
        method: "POST",
        headers: { "xi-api-key": _ek, "Content-Type": "application/json" },
        body: JSON.stringify({
          text: text,
          model_id: "eleven_flash_v2_5",
          language_code: "pl",
          voice_settings: {
            stability: 0.58,
            similarity_boost: 0.80,
            style: 0.0,
            use_speaker_boost: true,
            speed: 1.02
          }
        })
      }
    );
    if (!res.ok) throw new Error("TTS HTTP " + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    await new Promise((resolve) => {
      currentAudio = new Audio(url);
      currentAudio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
      currentAudio.onerror = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
      currentAudio.play().catch(() => resolve());
    });
  } catch (e) {
    console.error("TTS error:", e);
  }
}

function connectReplyStream() {
  if (sseOut) sseOut.close();
  sseOut = new EventSource(`https://ntfy.sh/${NTFY_OUT}/sse`);
  sseOut.onmessage = async (ev) => {
    try {
      const data = JSON.parse(ev.data);
      if (data.event !== "message" || !data.message) return;
      if (data.time && data.time < activeTurnStartTs - 5) return;

      let msgText = data.message.trim();
      if (!msgText) return;

      if (msgText.startsWith("{") && msgText.endsWith("}")) {
        try {
          const parsed = JSON.parse(msgText);
          if (parsed.turn_id && spokenTurnIds.has(parsed.turn_id + "_" + (parsed.part || "full"))) return;
          if (parsed.turn_id) spokenTurnIds.add(parsed.turn_id + "_" + (parsed.part || "full"));

          // Na ekranie pokazujemy tekst z normalnymi cyframi (display_text lub text)
          const screenText = parsed.display_text || parsed.text || "";
          const audioText = parsed.tts_text || parsed.text || "";

          if (parsed.part === "first") {
            document.getElementById("jarvisText").innerText = "Jarvis: " + screenText + "...";
            enqueueSpeak(audioText);
            return;
          } else if (parsed.part === "rest") {
            if (parsed.full_text) {
              document.getElementById("jarvisText").innerText = "Jarvis: " + parsed.full_text;
            }
            if (audioText) enqueueSpeak(audioText);
            return;
          } else if (parsed.part === "full") {
            document.getElementById("jarvisText").innerText = "Jarvis: " + screenText;
            enqueueSpeak(audioText);
            return;
          }
        } catch(e) {}
      }

      if (spokenTurnIds.has( data.id )) return;
      spokenTurnIds.add(data.id);
      document.getElementById("jarvisText").innerText = "Jarvis: " + msgText;
      enqueueSpeak(msgText);
    } catch (e) {}
  };
}

async function startCall() {
  if (callActive) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1
      }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);

    // 3-stopniowy filtr pasmowy ludzkiej mowy (300 Hz - 3400 Hz)
    // Wycina całkowicie kroki, wiatr, stuknięcia i szum ulicy przed analizatorem VAD!
    const hpFilter = audioCtx.createBiquadFilter();
    hpFilter.type = "highpass";
    hpFilter.frequency.value = 300;
    hpFilter.Q.value = 0.707;

    const lpFilter = audioCtx.createBiquadFilter();
    lpFilter.type = "lowpass";
    lpFilter.frequency.value = 3400;
    lpFilter.Q.value = 0.707;

    const formantBoost = audioCtx.createBiquadFilter();
    formantBoost.type = "peaking";
    formantBoost.frequency.value = 1350;
    formantBoost.gain.value = 3.0;
    formantBoost.Q.value = 1.0;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.35;

    src.connect(hpFilter);
    hpFilter.connect(lpFilter);
    lpFilter.connect(formantBoost);
    formantBoost.connect(analyser);

    callActive = true;
    activeTurnStartTs = Math.floor(Date.now() / 1000);
    connectReplyStream();
    monitorVoiceLoop();
    playReadyChime();
    startRecordingUtterance();
  } catch (err) {
    setUIState("idle", "Brak dostępu do mikrofonu", "Zezwól na mikrofon w Telegramie i dotknij kuli", "⚠️", "Spróbuj ponownie");
  }
}

function startRecordingUtterance() {
  if (!callActive || isMuted) return;
  allChunks = [];
  sustainedSpeechFrames = 0;
  speechConfirmed = false;
  speechConfirmedAt = 0;
  silenceSince = 0;
  peakVoiceRms = 0;

  updateStatusUI();

  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
    ? "audio/webm;codecs=opus"
    : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");
  mediaRecorder = mime ? new MediaRecorder(micStream, { mimeType: mime }) : new MediaRecorder(micStream);

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) allChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    if (!callActive) return;
    if (allChunks.length === 0) {
      if (state === "listening" || state === "speaking-user") startRecordingUtterance();
      return;
    }
    const actualMime = mediaRecorder.mimeType || "audio/webm";
    const ext = actualMime.includes("mp4") ? "mp4" : "webm";
    const blob = new Blob(allChunks, { type: actualMime });
    if (blob.size < 900) {
      if (callActive) startRecordingUtterance();
      return;
    }
    await transcribeAndSend(blob, ext);
  };

  mediaRecorder.start(100);
}

function finishTurnAndSend() {
  if (!callActive) return;
  if (mediaRecorder && mediaRecorder.state === "recording") {
    speechConfirmed = true;
    mediaRecorder.stop();
  }
}

// Pętla detekcji ludzkiej mowy (Voice Bandpass 300-3400 Hz + Adaptive Noise Floor + Continuous Cadence Gate)
function monitorVoiceLoop() {
  if (!callActive) return;
  const buf = new Uint8Array(analyser.frequencyBinCount);

  const tick = () => {
    if (!callActive) return;
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) {
      const v = (buf[i] - 128) / 128;
      sum += v * v;
    }
    const voiceRms = Math.sqrt(sum / buf.length);

    const s1 = 1 + Math.min(voiceRms * 3.0, 0.42);
    const s2 = 1 + Math.min(voiceRms * 5.0, 0.70);
    document.getElementById("ring1").style.transform = `scale(${s1})`;
    document.getElementById("ring2").style.transform = `scale(${s2})`;

    const now = performance.now();

    if ((state === "listening" || state === "speaking-user") && !isMuted) {
      // Dynamiczny próg powyżej tła (minimum 0.028, żeby odciąć kroki i szum ulicy)
      const dynamicThreshold = Math.max(0.028, Math.min(0.065, noiseFloor * 2.5));

      if (voiceRms > dynamicThreshold) {
        sustainedSpeechFrames++;
        silenceSince = 0;
        if (voiceRms > peakVoiceRms) peakVoiceRms = voiceRms;

        // Wymagamy co najmniej ~360ms ciągłego pasma ludzkiego głosu (odrzuca stuknięcia, kroki, chrząknięcia)
        if (sustainedSpeechFrames >= 5 && !speechConfirmed) {
          speechConfirmed = true;
          speechConfirmedAt = now;
          setUIState("speaking-user", "Słyszę Cię — mów dalej...", "Po krótkiej pauzie wyślę automatycznie (lub dotknij kuli)", "🗣️", "Dotknij, by wysłać od razu");
        }
      } else {
        // Aktualizuj poziom tła tylko gdy nie mówimy
        if (!speechConfirmed) {
          sustainedSpeechFrames = Math.max(0, sustainedSpeechFrames - 1);
          noiseFloor = noiseFloor * 0.96 + voiceRms * 0.04;
        } else if (listenMode === "auto") {
          if (!silenceSince) silenceSince = now;
          const silenceDuration = now - silenceSince;
          // Automatyczna wysyłka po 950ms ciszy od zakończenia wyraźnej wypowiedzi
          if (silenceDuration > 950 && mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }
      }
    }

    setTimeout(tick, 75);
  };
  tick();
}

// Odfiltrowuje halucynacje szumu z modelu STT (np. "(szum)", "(kroki)", pojedyncze litery)
function isNoiseHallucination(txt) {
  if (!txt) return true;
  const clean = txt.replace(/[\(\[\*].*?[\)\]\*]/g, "").replace(/[^\p{L}\p{N}]/gu, "").trim();
  if (clean.length < 2) return true;
  const lower = txt.toLowerCase().trim();
  const noisePhrases = [
    "dziękuję za uwagę", "napisy stworzone przez", "subskrybuj", "muzyka", "szum", "cisza", "westchnienie"
  ];
  if (noisePhrases.includes(lower)) return true;
  return false;
}

async function transcribeAndSend(audioBlob, ext) {
  setUIState("thinking", "Rozpoznaję i wykonuję...", "Przekazuję bezpośrednio do Antigravity Argon", "⚡", "Przetwarzam...");
  try {
    const fd = new FormData();
    fd.append("model_id", "scribe_v1");
    fd.append("language_code", "pl");
    fd.append("tag_audio_events", "false");
    fd.append("file", audioBlob, `speech.${ext || "webm"}`);

    const sttRes = await fetch("https://api.elevenlabs.io/v1/speech-to-text", {
      method: "POST",
      headers: { "xi-api-key": _ek },
      body: fd
    });

    if (!sttRes.ok) throw new Error("STT HTTP " + sttRes.status);
    const sttData = await sttRes.json();
    const userText = (sttData.text || "").trim();

    if (isNoiseHallucination(userText)) {
      if (callActive) startRecordingUtterance();
      return;
    }

    document.getElementById("youText").innerText = "Ty: " + userText;
    document.getElementById("jarvisText").innerText = "Jarvis: (pracuję nad odpowiedzią w Antigravity...)";
    activeTurnStartTs = Math.floor(Date.now() / 1000);

    await fetch(`https://ntfy.sh/${NTFY_IN}`, {
      method: "POST",
      body: JSON.stringify({
        type: "voice_call_turn",
        text: userText,
        ts: Date.now()
      })
    });
  } catch (e) {
    console.error("STT error:", e);
    if (callActive) startRecordingUtterance();
  }
}

function toggleMute() {
  isMuted = !isMuted;
  const btn = document.getElementById("muteBtn");
  if (isMuted) {
    btn.innerText = "🔇 Włącz mikrofon";
    setUIState("idle", "Mikrofon wyciszony", "Dotknij Włącz mikrofon, aby kontynuować", "🔇", "Wyciszony");
    if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  } else {
    btn.innerText = "🎤 Wycisz mikrofon";
    startRecordingUtterance();
  }
}

function endCall() {
  callActive = false;
  if (sseOut) sseOut.close();
  stopJarvisAudio();
  if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  setUIState("idle", "Rozmowa zakończona", "Dotknij kuli, aby połączyć ponownie", "📞", "Dotknij, by połączyć");
  if (tg) setTimeout(() => tg.close(), 350);
}

window.addEventListener("load", () => {
  setTimeout(startCall, 200);
});
</script>
