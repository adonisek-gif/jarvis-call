<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Argon Jarvis — Rozmowa na żywo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at 50% 25%, #162238 0%, #090d16 75%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 36px 24px 42px;
    overflow: hidden;
  }
  .header { text-align: center; }
  .name { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
  .state { font-size: 16px; color: #7dd3fc; font-weight: 500; min-height: 24px; }
  .timer { font-size: 13px; color: #64748b; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .orb-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .orb-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.35) 0%, rgba(56,189,248,0) 70%);
    transform: scale(1);
    transition: transform 0.08s ease-out;
  }
  .orb-core {
    position: relative;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0284c7, #2563eb);
    box-shadow: 0 0 40px rgba(37,99,235,0.6), inset 0 2px 12px rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    transition: background 0.25s, box-shadow 0.25s;
  }
  body.speaking .orb-core {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 0 50px rgba(16,185,129,0.7), inset 0 2px 12px rgba(255,255,255,0.4);
  }
  body.thinking .orb-core {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    box-shadow: 0 0 45px rgba(245,158,11,0.6);
    animation: pulseThink 1.1s infinite alternate;
  }
  @keyframes pulseThink {
    from { transform: scale(0.94); }
    to { transform: scale(1.06); }
  }

  .transcript-box {
    width: 100%;
    max-width: 380px;
    min-height: 92px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.45;
    color: #e2e8f0;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    backdrop-filter: blur(10px);
  }
  .sub-hint { font-size: 12px; color: #94a3b8; }

  .controls {
    display: flex;
    gap: 28px;
    align-items: center;
  }
  .btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform 0.12s;
  }
  .btn:active { transform: scale(0.92); }
  .btn-start { background: #22c55e; width: 84px; height: 84px; font-size: 34px; }
  .btn-end { background: #ef4444; }
  .btn-mute { background: rgba(255,255,255,0.14); font-size: 24px; }
  .btn-mute.muted { background: #f59e0b; }
</style>
</head>
<body>

<div class="header">
  <div class="name">Argon Jarvis</div>
  <div class="state" id="stateText">Kliknij zieloną słuchawkę, aby połączyć</div>
  <div class="timer" id="timerText">00:00</div>
</div>

<div class="orb-wrap" id="orbWrap" title="Dotknij kuli, aby od razu wysłać zdanie">
  <div class="orb-ring" id="orbRing"></div>
  <div class="orb-core" id="orbCore">🎙️</div>
</div>

<div class="transcript-box">
  <div id="liveText">Rozmowa głośnomówiąca na żywo — mów normalnie, gdy skończysz zdanie Jarvis od razu odpowie.</div>
  <div class="sub-hint" id="hintText">Na głośnej ulicy możesz też dotknąć niebieskiej kuli po zdaniu</div>
</div>

<div class="controls">
  <button class="btn btn-mute" id="muteBtn" style="display:none" title="Wycisz mikrofon">🎤</button>
  <button class="btn btn-start" id="callBtn">📞</button>
</div>

<script>
(function() {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const hash = new URLSearchParams(location.hash.slice(1));
  const EL_KEY = hash.get("k") || "";
  const VOICE_ID = hash.get("v") || "lc6Dl3NzLdwoeMtGGKjy";
  const IN_TOPIC = hash.get("in") || "";
  const OUT_TOPIC = hash.get("out") || "";

  const stateEl = document.getElementById("stateText");
  const timerEl = document.getElementById("timerText");
  const liveEl = document.getElementById("liveText");
  const orbRing = document.getElementById("orbRing");
  const orbCore = document.getElementById("orbCore");
  const orbWrap = document.getElementById("orbWrap");
  const callBtn = document.getElementById("callBtn");
  const muteBtn = document.getElementById("muteBtn");

  let inCall = false;
  let isMuted = false;
  let mode = "idle"; // idle | listening | thinking | speaking
  let audioCtx = null;
  let mediaStream = null;
  let mediaRecorder = null;
  let chunks = [];
  let speakingDetected = false;
  let silenceStart = 0;
  let recordStart = 0;
  let sse = null;
  let currentAudio = null;
  let callStartTime = 0;
  let timerInterval = null;
  let vadInterval = null;

  function setMode(m, label) {
    mode = m;
    document.body.className = m;
    stateEl.textContent = label;
    if (m === "listening") orbCore.textContent = "🎙️";
    else if (m === "thinking") orbCore.textContent = "⚡";
    else if (m === "speaking") orbCore.textContent = "🔊";
  }

  function updateTimer() {
    if (!inCall) return;
    const sec = Math.floor((Date.now() - callStartTime) / 1000);
    const mm = String(Math.floor(sec / 60)).padStart(2, "0");
    const ss = String(sec % 60).padStart(2, "0");
    timerEl.textContent = mm + ":" + ss;
  }

  async function speakText(text) {
    if (!inCall) return;
    setMode("speaking", "Jarvis mówi...");
    liveEl.textContent = "🤖 " + text;

    try {
      const clean = text.replace(/[•🟢⚡✅🔊]/g, "").trim();
      const resp = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + VOICE_ID + "?output_format=mp3_44100_64", {
        method: "POST",
        headers: {
          "xi-api-key": EL_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text: clean,
          model_id: "eleven_flash_v2_5",
          language_code: "pl",
          voice_settings: { stability: 0.45, similarity_boost: 0.8, speed: 1.06 }
        })
      });
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      if (currentAudio) {
        currentAudio.pause();
      }
      currentAudio = new Audio(url);
      currentAudio.onended = () => {
        URL.revokeObjectURL(url);
        if (inCall) startListeningTurn();
      };
      currentAudio.onerror = () => {
        if (inCall) startListeningTurn();
      };
      await currentAudio.play();
    } catch (e) {
      if (inCall) startListeningTurn();
    }
  }

  function connectSSE() {
    if (sse) sse.close();
    sse = new EventSource("https://ntfy.sh/" + OUT_TOPIC + "/sse");
    sse.onmessage = (ev) => {
      if (!inCall) return;
      try {
        const data = JSON.parse(ev.data);
        if (data.event === "message" && data.message) {
          speakText(data.message);
        }
      } catch (e) {}
    };
  }

  async function processRecordedBlob(blob) {
    if (!inCall || blob.size < 1200) {
      if (inCall) startListeningTurn();
      return;
    }
    setMode("thinking", "Rozpoznaję i działam...");
    try {
      const fd = new FormData();
      fd.append("model_id", "scribe_v1");
      fd.append("language_code", "pl");
      fd.append("file", blob, "voice.webm");

      const r = await fetch("https://api.elevenlabs.io/v1/speech-to-text", {
        method: "POST",
        headers: { "xi-api-key": EL_KEY },
        body: fd
      });
      const j = await r.json();
      const txt = (j.text || "").trim();
      if (!txt || txt.length < 2) {
        if (inCall) startListeningTurn();
        return;
      }
      liveEl.textContent = "🗣️ Ty: „" + txt + "”";
      setMode("thinking", "Jarvis sprawdza na Macu...");

      await fetch("https://ntfy.sh/" + IN_TOPIC, {
        method: "POST",
        body: txt
      });
    } catch (e) {
      liveEl.textContent = "Błąd sieci — próbuję dalej...";
      if (inCall) setTimeout(startListeningTurn, 1200);
    }
  }

  function startListeningTurn() {
    if (!inCall || !mediaStream) return;
    setMode("listening", isMuted ? "Mikrofon wyciszony" : "Słucham Cię — mów normalnie...");
    chunks = [];
    speakingDetected = false;
    silenceStart = 0;
    recordStart = Date.now();

    try {
      mediaRecorder = new MediaRecorder(mediaStream);
    } catch (e) {
      mediaRecorder = new MediaRecorder(mediaStream);
    }
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      if (!inCall || mode !== "listening") return;
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
      processRecordedBlob(blob);
    };
    mediaRecorder.start(200);
  }

  function finishCurrentSentenceNow() {
    if (mode === "listening" && mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
    } else if (mode === "speaking" && currentAudio) {
      // Pozwól przerwać Jarvisowi w pół słowa!
      currentAudio.pause();
      startListeningTurn();
    }
  }

  orbWrap.addEventListener("click", () => {
    if (inCall) finishCurrentSentenceNow();
  });

  async function startCall() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(mediaStream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const dataArr = new Uint8Array(analyser.frequencyBinCount);

      inCall = true;
      callStartTime = Date.now();
      callBtn.className = "btn btn-end";
      callBtn.textContent = "📵";
      muteBtn.style.display = "flex";
      timerInterval = setInterval(updateTimer, 1000);

      connectSSE();

      vadInterval = setInterval(() => {
        if (!inCall || mode !== "listening" || isMuted) {
          orbRing.style.transform = "scale(1)";
          return;
        }
        analyser.getByteFrequencyData(dataArr);
        let sum = 0;
        for (let i = 2; i < 60; i++) sum += dataArr[i];
        const avg = sum / 58;
        const scale = Math.min(1.65, 1 + avg / 95);
        orbRing.style.transform = "scale(" + scale.toFixed(2) + ")";

        const now = Date.now();
        if (avg > 22) {
          if (!speakingDetected) {
            speakingDetected = true;
            stateEl.textContent = "Słyszę Cię...";
          }
          silenceStart = now;
        } else if (speakingDetected && silenceStart > 0 && (now - silenceStart > 750)) {
          // 0.75s ciszy po wypowiedzi -> błyskawicznie wyślij!
          speakingDetected = false;
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }
      }, 50);

      speakText("Jestem. Co tam?");
    } catch (err) {
      stateEl.textContent = "Dotknij zielonej słuchawki, aby włączyć mikrofon";
      liveEl.textContent = "Kliknij zieloną słuchawkę poniżej, żeby połączyć.";
    }
  }

  // Automatyczny start połączenia od razu po otwarciu okna!
  setTimeout(() => {
    if (!inCall) startCall();
  }, 150);

  function endCall() {
    inCall = false;
    setMode("idle", "Połączenie zakończone");
    if (timerInterval) clearInterval(timerInterval);
    if (vadInterval) clearInterval(vadInterval);
    if (sse) sse.close();
    if (currentAudio) currentAudio.pause();
    if (mediaRecorder && mediaRecorder.state === "recording") {
      try { mediaRecorder.stop(); } catch (e) {}
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
    }
    callBtn.className = "btn btn-start";
    callBtn.textContent = "📞";
    muteBtn.style.display = "none";
  }

  callBtn.addEventListener("click", () => {
    if (!inCall) startCall();
    else endCall();
  });

  muteBtn.addEventListener("click", () => {
    isMuted = !isMuted;
    muteBtn.classList.toggle("muted", isMuted);
    muteBtn.textContent = isMuted ? "🔇" : "🎤";
    if (mode === "listening") {
      stateEl.textContent = isMuted ? "Mikrofon wyciszony" : "Słucham Cię — mów normalnie...";
    }
  });
})();
</script>
</body>
</html>
